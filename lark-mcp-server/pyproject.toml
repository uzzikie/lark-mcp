[project]
name = "lark-mcp-server"
version = "0.1.0"
description = "FastMCP server wrapping lark-cli, with OAuth against Lark's authorization-code flow"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.7",
    "httpx>=0.27",
    "uvicorn>=0.34",
    "py-key-value-aio[disk]>=0.4.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lark_mcp_server"]
